name: Build and upload macOS DMG

on:
  release:
    types: [published]
  # Allow manual runs from the Actions UI (useful to re-run packaging for an existing release)
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the DMG to (optional). If empty the job will prefer the release event tag or default to development."
        required: false

jobs:
  build-dmg:
    name: Build macOS DMG and upload
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Determine runner architecture
        id: arch
        run: |
          runner_arch=$(uname -m)
          if [[ "$runner_arch" == "arm64" ]]; then
            arch_name=macos-arm64
          else
            arch_name=macos-amd64
          fi
          echo "runner_arch=$runner_arch" >> $GITHUB_OUTPUT
          echo "arch_name=$arch_name" >> $GITHUB_OUTPUT

      - name: Build for native arch
        env:
          VERSION: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.release.published_at }}
        run: |
          if [[ "${{ steps.arch.outputs.runner_arch }}" == "arm64" ]]; then
            ARCH=macos-arm64
          else
            ARCH=macos-amd64
          fi
          echo "Building for $ARCH"
          ./scripts/build-macos.sh "$VERSION" "$COMMIT" "$DATE"

      - name: Create DMG
        id: create_dmg
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
        run: |
          if [[ "${{ steps.arch.outputs.runner_arch }}" == "arm64" ]]; then
            ARCH=macos-arm64
          else
            ARCH=macos-amd64
          fi
          # Compute VERSION_BASE: precedence is workflow input -> release event tag -> default 'development'
          if [[ -n "$INPUT_TAG" && "$INPUT_TAG" != 'null' ]]; then
            VERSION_BASE="$INPUT_TAG"
          elif [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != 'null' ]]; then
            VERSION_BASE="$RELEASE_TAG"
          else
            VERSION_BASE="development"
          fi

          # Append a UTC timestamp to make the DMG filename unambiguous
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          VERSION="${VERSION_BASE}-${TIMESTAMP}"

          echo "Using VERSION=$VERSION and ARCH=$ARCH"
          # Export VERSION_BASE so downstream steps can use the canonical tag (without timestamp)
          echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT

          # First assemble the app so we can codesign / notarize if creds are available
          ./scripts/create-macos-dmg.sh "$ARCH" "$VERSION" assemble

          ASSEMBLED_APP=dist/macos-dmg/PasswordManager.app

          # Optionally codesign if credentials provided
          if [[ -n "$MACOS_SIGNING_IDENTITY" && -n "$APPLE_NOTARIZE_USERNAME" ]]; then
            echo "Signing app with identity from secrets..."
            security create-keychain -p actions build.keychain || true
            # Import signing key (expecting a base64-encoded p12 in MACOS_SIGNING_P12_BASE64)
            echo "$MACOS_SIGNING_P12_BASE64" | base64 --decode > /tmp/signing.p12
            # Note: securely importing cert requires further setup; placeholder shown here
            echo "(Signing steps placeholder - configure keychain and import signing certificate)"
            # Example (commented):
            # security import /tmp/signing.p12 -k ~/Library/Keychains/login.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            # codesign -s "$MACOS_SIGNING_IDENTITY" --deep --force "$ASSEMBLED_APP"
            # After creating a signed DMG, submit for notarization with xcrun altool or notarytool
          else
            echo "No signing/notarization secrets provided; skipping codesign/notarize."
          fi

          # Create the DMG from assembled (signed or unsigned) app
          ./scripts/create-macos-dmg.sh "$ARCH" "$VERSION"

          # Debug: verify DMG was created and show contents for easier troubleshooting in Actions logs
          DMG_PATH="dist/macos-dmg/GoPasswordManager-${VERSION}-${ARCH}.dmg"
          # If the expected path doesn't exist, pick the single .dmg in the folder (if any)
          if [[ ! -f "$DMG_PATH" ]]; then
            DMG_PATH=$(ls dist/macos-dmg/*.dmg 2>/dev/null | head -n1 || true)
          fi
          echo "Looking for DMG at: $DMG_PATH"
          echo "Listing dist/macos-dmg contents:" && ls -la dist/macos-dmg || true
          if [[ -z "$DMG_PATH" || ! -f "$DMG_PATH" ]]; then
            echo "ERROR: expected DMG not found: $DMG_PATH" >&2
            echo "Contents of dist/macos-dmg:" && ls -la dist/macos-dmg || true
            exit 2
          fi
          DMG_SIZE=$(stat -f '%z' "$DMG_PATH" 2>/dev/null || stat -c '%s' "$DMG_PATH" 2>/dev/null || echo 0)
          echo "DMG present: $DMG_SIZE bytes"

          # Export outputs for downstream steps
          DMG_NAME=$(basename "$DMG_PATH")
          echo "dmg_path=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve release upload URL (for manual runs)
        id: resolve_upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If the release event provided an upload_url, use it
          if [[ -n "${{ github.event.release.upload_url }}" && "${{ github.event.release.upload_url }}" != 'null' ]]; then
            echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Otherwise attempt to look up the release by the canonical release tag (requires GITHUB_TOKEN)
          # Prefer the workflow input (release_tag) or the release event tag; if missing, fall back to the computed version_base
          if [[ -n "${{ github.event.inputs.release_tag }}" && "${{ github.event.inputs.release_tag }}" != 'null' ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ -n "${{ github.event.release.tag_name }}" && "${{ github.event.release.tag_name }}" != 'null' ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # fallback to the version_base exported by create_dmg (this will be 'development' or the provided tag)
            TAG="${{ steps.create_dmg.outputs.version_base }}"
            if [[ -z "$TAG" || "$TAG" == 'null' ]]; then
              echo "ERROR: no release tag available to look up. Run this workflow from a Release event or pass the 'release_tag' input." >&2
              exit 2
            fi
          fi
          echo "Looking up release for tag: $TAG"
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
          echo "Querying $API_URL"
          RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$API_URL")
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r .upload_url // empty)
          if [[ -z "$UPLOAD_URL" ]]; then
            echo "Release for tag $TAG not found; attempting to create a new release based on latest release"
            # Fetch latest release
            LATEST=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")
            LATEST_TAG=$(echo "$LATEST" | jq -r .tag_name // empty)
            if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
              echo "No existing releases found. Creating initial release v1.0.0"
              NEXT_TAG="v1.0.0"
            else
              # Try to bump semver patch: supports vMAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH
              if [[ "$LATEST_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJ=${BASH_REMATCH[1]}
                MIN=${BASH_REMATCH[2]}
                PAT=${BASH_REMATCH[3]}
                NEWPAT=$((PAT + 1))
                NEXT_TAG="v${MAJ}.${MIN}.${NEWPAT}"
              else
                # Non-semver tag, append -1 to create a new distinct tag
                NEXT_TAG="${LATEST_TAG}-1"
              fi
            fi

            echo "Creating release with tag: $NEXT_TAG"
            CREATE_PAYLOAD=$(jq -n --arg t "$NEXT_TAG" '{ tag_name: $t, name: $t, body: "Automated DMG release", draft: false, prerelease: false }')
            CREATE_RESP=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" -d "$CREATE_PAYLOAD" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
            UPLOAD_URL=$(echo "$CREATE_RESP" | jq -r .upload_url // empty)
            if [[ -z "$UPLOAD_URL" ]]; then
              echo "ERROR: failed to create release. Response: $CREATE_RESP" >&2
              exit 2
            fi
            echo "Created release $NEXT_TAG"
          fi
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT

      - name: Upload DMG file
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.resolve_upload.outputs.upload_url }}
          asset_path: ${{ steps.create_dmg.outputs.dmg_path }}
          asset_name: ${{ steps.create_dmg.outputs.dmg_name }}
          asset_content_type: application/x-apple-diskimage

      - name: Note about signing
        run: |
          echo "Built DMG is unsigned. For Gatekeeper-friendly releases sign & notarize the .app before packaging."
