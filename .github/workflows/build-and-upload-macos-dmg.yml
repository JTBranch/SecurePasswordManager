name: Build and upload macOS DMG

on:
  release:
    types: [published]
  # Allow manual runs from the Actions UI (useful to re-run packaging for an existing release)
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the DMG to (optional). If empty the job will prefer the release event tag or default to development.'
        required: false

jobs:
  build-dmg:
    name: Build macOS DMG and upload
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Determine runner architecture
        id: arch
        run: |
          runner_arch=$(uname -m)
          if [[ "$runner_arch" == "arm64" ]]; then
            arch_name=macos-arm64
          else
            arch_name=macos-amd64
          fi
          echo "runner_arch=$runner_arch" >> $GITHUB_OUTPUT
          echo "arch_name=$arch_name" >> $GITHUB_OUTPUT

      - name: Build for native arch
        env:
          VERSION: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.release.published_at }}
        run: |
          if [[ "${{ steps.arch.outputs.runner_arch }}" == "arm64" ]]; then
            ARCH=macos-arm64
          else
            ARCH=macos-amd64
          fi
          echo "Building for $ARCH"
          ./scripts/build-macos.sh "$VERSION" "$COMMIT" "$DATE"

      - name: Create DMG
        id: create_dmg
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
        run: |
          if [[ "${{ steps.arch.outputs.runner_arch }}" == "arm64" ]]; then
            ARCH=macos-arm64
          else
            ARCH=macos-amd64
          fi
          # Compute VERSION: precedence is workflow input -> release event tag -> default 'development'
          if [[ -n "$INPUT_TAG" && "$INPUT_TAG" != 'null' ]]; then
            VERSION="$INPUT_TAG"
          elif [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != 'null' ]]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="development"
          fi

          echo "Using VERSION=$VERSION and ARCH=$ARCH"

          # First assemble the app so we can codesign / notarize if creds are available
          ./scripts/create-macos-dmg.sh "$ARCH" "$VERSION" assemble

          ASSEMBLED_APP=dist/macos-dmg/PasswordManager.app

          # Optionally codesign if credentials provided
          if [[ -n "$MACOS_SIGNING_IDENTITY" && -n "$APPLE_NOTARIZE_USERNAME" ]]; then
            echo "Signing app with identity from secrets..."
            security create-keychain -p actions build.keychain || true
            # Import signing key (expecting a base64-encoded p12 in MACOS_SIGNING_P12_BASE64)
            echo "$MACOS_SIGNING_P12_BASE64" | base64 --decode > /tmp/signing.p12
            # Note: securely importing cert requires further setup; placeholder shown here
            echo "(Signing steps placeholder - configure keychain and import signing certificate)"
            # Example (commented):
            # security import /tmp/signing.p12 -k ~/Library/Keychains/login.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            # codesign -s "$MACOS_SIGNING_IDENTITY" --deep --force "$ASSEMBLED_APP"
            # After creating a signed DMG, submit for notarization with xcrun altool or notarytool
          else
            echo "No signing/notarization secrets provided; skipping codesign/notarize."
          fi

          # Create the DMG from assembled (signed or unsigned) app
          ./scripts/create-macos-dmg.sh "$ARCH" "$VERSION"

          # Debug: verify DMG was created and show contents for easier troubleshooting in Actions logs
          DMG_PATH="dist/macos-dmg/GoPasswordManager-${VERSION}-${ARCH}.dmg"
          echo "Looking for DMG at: $DMG_PATH"
          echo "Listing dist/macos-dmg contents:" && ls -la dist/macos-dmg || true
          if [[ ! -f "$DMG_PATH" ]]; then
            echo "ERROR: expected DMG not found: $DMG_PATH" >&2
            echo "Contents of dist/macos-dmg:" && ls -la dist/macos-dmg || true
            exit 2
          fi
          echo "DMG present: $(stat -f '%z bytes' "$DMG_PATH" || stat -c '%s bytes' "$DMG_PATH" || true)"

          # Export the computed version for downstream steps
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve release upload URL (for manual runs)
        id: resolve_upload
        run: |
          # If the release event provided an upload_url, use it
          if [[ -n "${{ github.event.release.upload_url }}" && "${{ github.event.release.upload_url }}" != 'null' ]]; then
            echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Otherwise attempt to look up the release by tag (requires GITHUB_TOKEN)
          TAG="${{ steps.create_dmg.outputs.version }}"
          if [[ -z "$TAG" || "$TAG" == 'null' ]]; then
            TAG=development
          fi
          echo "Looking up release for tag: $TAG"
          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
          echo "Querying $API_URL"
          RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$API_URL")
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r .upload_url)
          if [[ "$UPLOAD_URL" == "null" || -z "$UPLOAD_URL" ]]; then
            echo "ERROR: could not determine release upload_url for tag $TAG" >&2
            echo "Response: $RESPONSE" >&2
            exit 2
          fi
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT

      - name: Upload DMG file
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.resolve_upload.outputs.upload_url }}
          asset_path: dist/macos-dmg/GoPasswordManager-${{ steps.create_dmg.outputs.version }}-${{ steps.arch.outputs.arch_name }}.dmg
          asset_name: GoPasswordManager-${{ steps.create_dmg.outputs.version }}-${{ steps.arch.outputs.arch_name }}.dmg
          asset_content_type: application/x-apple-diskimage

      - name: Note about signing
        run: |
          echo "Built DMG is unsigned. For Gatekeeper-friendly releases sign & notarize the .app before packaging."
