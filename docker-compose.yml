services:
  instance-a:
    build: .
    container_name: vpm_instance_a
    volumes:
      - ./tmp/instance-a:/app
    environment:
      - VPM_INSTANCE_NAME=instance-a
      - VPM_LISTEN_ADDR=0.0.0.0:39001
      - VPM_ADVERTISED_ADDR=instance-a:39001
    ports:
      - "39001:39001"
    networks:
      - vpm-net

  instance-b:
    build: .
    container_name: vpm_instance_b
    volumes:
      - ./tmp/instance-b:/app
    environment:
      - VPM_INSTANCE_NAME=instance-b
      - VPM_LISTEN_ADDR=0.0.0.0:39002
      - VPM_ADVERTISED_ADDR=instance-b:39002
    ports:
      - "39002:39002"
    networks:
      - vpm-net

networks:
  vpm-net:
    driver: bridge
